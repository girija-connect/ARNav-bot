# Localization (ROS 2 Humble): static map server + AMCL for ARNAV.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.1
    sigma_hit: 0.1
    laser_likelihood_max_dist: 2.0
    max_beams: 360
    min_particles: 1000
    max_particles: 3000
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose: {x: 0.0, y: -9.0, z: 0.0, yaw: 1.5708}   # = home pose in layout.yaml

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
