# Parameters for the ARNAV rack stack. 
scan_merger:
  ros__parameters:
    use_sim_time: true
    mount_front: [0.37, 0.0, 0.0]           # single front lidar (x, y, yaw) in the robot centre frame
    output_frame: scan_link
    num_bins: 720
    range_max: 12.0
    self_box: [0.40, 0.30]                  # returns inside this box (half x, half y) are the robot itself
    rack_box: [0.55, 0.55]                  # cut out while a rack is on the plate
rack_detector:
  ros__parameters:
    use_sim_time: true
    output_frame: base_footprint
    rack_side: 0.90                         # leg centre to leg centre. Must match the real rack.
    leg_size: 0.04
    tol_side: 0.06
    tol_match: 0.07
    max_range: 6.0
jack_controller:
  ros__parameters:
    use_sim_time: true
    speed: 0.02                             # m/s
    max_height: 0.08
    lift_height: 0.07
rack_docking:
  ros__parameters:
    use_sim_time: true
    lift_height: 0.07
    v_max: 0.25
    reverse_v: 0.20
    retreat_distance: 1.3
    rfid_wait: 3.0                          # s to wait for the expected tag once centred (only if the goal names one)
    rfid_max_age: 1.0                       # s, a tag read older than this does not count
rfid_reader_sim:
  ros__parameters:
    use_sim_time: true
